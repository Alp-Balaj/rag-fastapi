[project]
name = "rag-fastapi"
version = "0.1.0"
description = "Retrieval-augmented generation over your own documents: FastAPI + local embeddings + Claude"
readme = "README.md"
authors = [
    { name = "Alp Balaj", email = "alpbalaj1203@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi[standard]>=0.162.2",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
rag-ingest = "rag_fastapi.ingest:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
